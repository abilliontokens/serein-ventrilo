[package]
name = "ventrilo"
version = "1.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abilliontokens/serein-ventrilo"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Local Serein checkout for the SDK's native row actions, window size and controls;
# re-pinned to a Serein revision once those land.
serein-extension-sdk = { git = "https://github.com/abilliontokens/Serein", rev = "0434bc7cc45455f535bd654ee254bdce4c201af7" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
